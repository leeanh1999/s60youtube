name: Build anh Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build rieng ban amd64 truoc de chay thu that su, roi moi phat hanh.
      - name: Build de kiem thu
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: s60youtube:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chay thu container
        run: |
          docker run -d --name test -p 8080:8080 s60youtube:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "May chu da san sang sau ${i}s"
              break
            fi
            sleep 1
          done
          docker logs test

      - name: Kiem tra co yt-dlp va ffmpeg trong anh
        run: |
          docker exec test yt-dlp --version
          docker exec test ffmpeg -version | head -n 1
          docker exec test node -e "console.log('ffmpeg dung duoc:', require('/app/lib/media').isAvailable())"

      - name: Kiem thu cac trang
        run: |
          BASE=http://127.0.0.1:8080 node tools/smoke.js
          BASE=http://127.0.0.1:8080 node tools/test-login.js

      - name: Kiem tra du lieu nam trong volume
        run: |
          docker exec test node -e "const c=require('/app/lib/config'); console.log(c.DATA_DIR, c.CACHE_DIR, c.COOKIES_FILE)" | grep -q '^/data'
          docker exec test sh -c 'test -d /data/cache'

      - name: Don dep
        if: always()
        run: docker rm -f test || true

      - name: Dang nhap GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nhan cho anh
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build va day len GHCR (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
