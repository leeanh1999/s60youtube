name: Build anh Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build rieng ban amd64 truoc de chay thu that su, roi moi phat hanh.
      - name: Thong tin ban dung
        id: info
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build de kiem thu
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: s60youtube:test
          build-args: |
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chay thu container
        run: |
          docker run -d --name test -p 8080:8080 s60youtube:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "May chu da san sang sau ${i}s"
              break
            fi
            sleep 1
          done
          docker logs test

      - name: Kiem tra co yt-dlp va ffmpeg trong anh
        run: |
          docker exec test yt-dlp --version
          docker exec test ffmpeg -version | head -n 1
          docker exec test node -e "console.log('ffmpeg dung duoc:', require('/app/lib/media').isAvailable())"

      - name: Kiem thu cac trang
        run: |
          BASE=http://127.0.0.1:8080 node tools/smoke.js
          BASE=http://127.0.0.1:8080 node tools/test-login.js

      # Trang video khong duoc cho yt-dlp cho xong moi ve. Bai thu dung mot
      # yt-dlp gia cham de do dung cho do.
      - name: Kiem thu toc do mo trang video
        run: node tools/test-watch.js

      # Phep do 'position: fixed' chi lo sai tren dien thoai, nen thu bang may
      # gia: dan dung, dan gia, hai kieu do khong duoc, va may khai ten Opera
      # Mobile (nen Presto khong dan that nen phai bo han viec dan).
      - name: Kiem thu phep do dan thanh
        run: node tools/test-pin.js

      # Chay trong container de kiem luon ffmpeg cua anh: no phai co libx264
      # va muxer ipod thi hai muc chuyen ma moi ra duoc file.
      - name: Kiem thu chuyen ma
        run: docker exec test node /app/tools/test-convert.js

      # Trinh phat do phan giai cao chi chay tren may doi moi va hong thi tu lui
      # ve duong /hd, nen nhin ben ngoai khong biet. Thu bang may gia, tren mot
      # doan phim mau co bang chi muc y nhu luong cua YouTube.
      - name: Kiem thu trinh phat do phan giai cao
        run: docker exec test node /app/tools/test-hd.js

      # Bieu tuong do may chu to tu hinh SVG ra PNG. Hinh nao viet sai thi chi
      # hong dung luc co trang goi toi no, nen to thu ca bo o day.
      - name: To thu toan bo bieu tuong
        run: |
          docker exec test node -e "
          const icons = require('/app/lib/icons');
          let bytes = 0;
          for (const name of Object.keys(icons.SHAPES)) {
            for (const tint of Object.keys(icons.TINTS)) {
              const png = icons.png(name + '-' + tint + '.png');
              if (!png || png.length < 100) throw new Error('hong hinh ' + name + '-' + tint);
              bytes += png.length;
            }
          }
          console.log('to duoc ca bo bieu tuong,', bytes, 'byte');
          "

      - name: Trang Gioi thieu phai bao dung ban dang chay
        run: |
          curl -fsS http://127.0.0.1:8080/about > about.html
          grep -q "${{ steps.info.outputs.version }}" about.html
          grep -q "yt-dlp" about.html
          echo "Trang Gioi thieu bao ban ${{ steps.info.outputs.version }}"

      - name: Kiem tra du lieu nam trong volume
        run: |
          docker exec test node -e "const c=require('/app/lib/config'); console.log(c.DATA_DIR, c.CACHE_DIR, c.COOKIES_FILE)" | grep -q '^/data'
          docker exec test sh -c 'test -d /data/cache'

      - name: Don dep
        if: always()
        run: docker rm -f test || true

      - name: Dang nhap GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nhan cho anh
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build va day len GHCR (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
