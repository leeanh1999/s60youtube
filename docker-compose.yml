# Dan nguyen file nay vao Container Manager > Du an (Project) tren Synology.
# Muon tu build tren NAS thi bo dong "image" va bo chu thich dong "build".

services:
  s60youtube:
    image: ghcr.io/leeanh1999/s60youtube:latest
    # build: .
    container_name: s60youtube
    restart: unless-stopped

    ports:
      # Trai la cong mo tren NAS, phai la cong ben trong container (de nguyen).
      - "9080:8080"

    volumes:
      # Giu cookie dang nhap cua tung may va file da chuyen ma qua cac lan
      # khoi dong lai. Cookie moi may nam trong ./data/devices.
      - ./data:/data

    environment:
      - TZ=Asia/Ho_Chi_Minh
      - YT_HL=vi
      - YT_GL=VN
      # Moi may vao trang tu nap cookie cua chinh no. Bien nay noi ve cookie
      # chung trong data/cookies.txt: 1 = may chua dang nhap van xem duoc bang
      # tai khoan cua chu may (dung trong nha). Mo ra Internet cho nhieu nguoi
      # thi dat 0 — luc do ai cung phai dang nhap bang tai khoan cua ho.
      - YT_SHARED_COOKIES=0
      # Cookie cua mot may bao nhieu ngay khong dung thi xoa.
      - DEVICE_TTL_DAYS=45
      # May da dang nhap thi trang chinh hien goi y rieng cua tai khoan do.
      # Moi lan lay phai goi yt-dlp (chung 2 giay, co dem 10 phut cho tung may).
      # NAS qua yeu thi dat 0, luc do trang chinh chi con danh sach chu de.
      - HOME_FEED=1
      # Chay sau reverse proxy ma proxy khong gui X-Forwarded-Proto/Host thi
      # dien dia chi cong khai vao day, de ma QR va trang /link ra dung dia chi.
      # - PUBLIC_URL=https://youtube.nha-toi.vn
      # Co reverse proxy dung truoc thi bat, de dem so lan nhap sai theo dung
      # IP nguoi dung chu khong phai IP cua proxy.
      # - TRUST_PROXY=1
      # Tu choi han viec nop cookie khi trang /link khong di qua HTTPS.
      # Bat khi da co chung chi — cookie la ca phien dang nhap Google.
      # - REQUIRE_SECURE_LINK=1
      # NAS thuong yeu CPU, chuyen ma mot video mot luc la vua.
      - MAX_JOBS=1
      # NAS chip ARM (Realtek RTD1296/RTD1619B) ma hoa rat cham.
      # Doi sang ultrafast de nhanh hon nhieu, doi lai file to hon mot chut.
      - FFMPEG_PRESET=ultrafast
      # yt-dlp cu se hong khi YouTube doi API; tu cap nhat luc khoi dong.
      - YTDLP_AUTO_UPDATE=1

    healthcheck:
      # Kiem tra ben trong container nen van la 8080, khong doi theo cong ngoai.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
